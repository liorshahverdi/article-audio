<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Article → Audio</title>
<style>
  :root { color-scheme: light dark; --accent: #4f7cff; }
  * { box-sizing: border-box; }
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 760px; margin: 0 auto; padding: 32px 20px; }
  h1 { font-size: 1.4rem; margin: 0 0 20px; }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type=url] { flex: 1 1 360px; padding: 10px 12px; font-size: 1rem; border: 1px solid #8886; border-radius: 8px; }
  button, select { padding: 10px 14px; font-size: 1rem; border-radius: 8px; border: 1px solid #8886; }
  button[type=submit] { background: var(--accent); color: #fff; border: none; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  #status { margin-top: 16px; min-height: 1.5em; color: #888; }
  #status.err { color: #e5484d; }
  #player { display: none; margin-top: 16px; }
  audio { width: 100%; }
  #title { font-size: 1.2rem; margin: 20px 0 8px; }
  #text { white-space: pre-wrap; opacity: .85; max-height: 50vh; overflow: auto; border-top: 1px solid #8884; padding-top: 12px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<h1>🎧 Article → Audio</h1>
<form id="f">
  <input type="url" id="url" placeholder="Paste an article or blog URL…" required autofocus>
  <button type="submit" id="go">Listen</button>
</form>
<div class="row">
  <label>Voice <select id="voice"><option value="af_heart">Heart (US, female)</option></select></label>
  <label>Speed <select id="rate">
    <option>0.9</option><option selected>1</option><option>1.15</option><option>1.25</option><option>1.5</option><option>1.75</option><option>2</option>
  </select></label>
</div>
<div id="status"></div>
<div id="player">
  <audio id="audio" controls preload="auto"></audio>
  <div class="row"><a id="dl" href="#">⬇ Download MP3</a></div>
  <div id="title"></div>
  <div id="text"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const audio = $('audio'), status = $('status');
let current = null;

const savedVoice = localStorage.getItem('voice');
const savedRate = localStorage.getItem('rate');
if (savedRate) $('rate').value = savedRate;

fetch('/api/voices').then(r => r.json()).then(vs => {
  const sel = $('voice'), want = savedVoice || sel.value;
  sel.innerHTML = vs.map(v => `<option value="${v.id}">${v.label}</option>`).join('');
  sel.value = vs.some(v => v.id === want) ? want : 'af_heart';
}).catch(() => {});

function setStatus(msg, err) { status.textContent = msg; status.className = err ? 'err' : ''; }

function play() {
  if (!current) return;
  const v = encodeURIComponent($('voice').value);
  const base = `/api/audio/${current.id}?voice=${v}`;
  audio.src = base;
  $('dl').href = base + '&download=1';
  audio.playbackRate = +$('rate').value;
  audio.play().catch(() => {});
  setStatus('Generating audio…');
}

$('f').onsubmit = async e => {
  e.preventDefault();
  $('go').disabled = true;
  setStatus('Fetching article…');
  try {
    const r = await fetch('/api/article?url=' + encodeURIComponent($('url').value.trim()));
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Failed');
    current = data;
    $('title').textContent = data.title;
    $('text').textContent = data.text;
    $('player').style.display = 'block';
    document.title = data.title;
    play();
  } catch (err) {
    setStatus(err.message, true);
  } finally {
    $('go').disabled = false;
  }
};

audio.onplaying = () => setStatus('');
audio.onerror = () => current && setStatus('Audio failed to load.', true);
$('voice').onchange = () => { localStorage.setItem('voice', $('voice').value); play(); };
$('rate').onchange = () => { localStorage.setItem('rate', $('rate').value); audio.playbackRate = +$('rate').value; };
</script>
</body>
</html>
